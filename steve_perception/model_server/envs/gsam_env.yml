# GroundingDINO + SAM for steve_perception's model_server (gsam). Sources and weights are external
# (config/model_server.yaml), not pip-installed.
#   PYTHONNOUSERSITE=1 conda env create -f gsam_env.yml
# (PYTHONNOUSERSITE: pip must not count packages in ~/.local as installed)
name: gsam_env
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - torchvision==0.20.1
      - numpy==1.26.4
      - transformers==4.46.3   # GroundingDINO's BERT wrapper breaks on transformers 5
      - timm==1.0.11
      - addict
      - yapf
      - pillow
      - pyzmq
      - opencv-python-headless==4.10.0.84
      - matplotlib             # imported by GroundingDINO's model module (visualizer)
      - pycocotools
      - termcolor
      - pyyaml
